server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Elastic Beanstalk / CloudWatch hit this to check the container is alive.
    # Kept separate from "/" so a broken homepage doesn't look like a dead server.
    location /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript text/html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
